name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  S3_BUCKET: model-bucket-mlops-vignesh

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for AWS OIDC authentication
      contents: write  # Required to push commits
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Use built-in token
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Generate dataset
      run: python generate_data.py
    
    - name: Train model
      run: python train.py
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::880335327306:role/s3-github-actions
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Push model to S3 directly
      run: |
        aws s3 cp models/churn_model.pkl s3://model-bucket-mlops-vignesh/models/churn_model.pkl
        echo "Model pushed to S3 is success"
    
    - name: Update inference.yaml with S3 model path
      run: |
        MODEL_URI="s3://model-bucket-mlops-vignesh/models/churn_model.pkl"
        sed -i "s|storageUri: .*|storageUri: $MODEL_URI|g" k8s/inference.yaml
    
    - name: Commit updated inference.yaml
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add k8s/inference.yaml
        git commit -m "Update model S3 path [skip ci]" || echo "No changes"
        git push || echo "No changes to push" 